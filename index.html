
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
    padding: 25px;
}

header {
    background: #222;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    margin-bottom: 25px;
}

header h1 {
    margin-bottom: 8px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 3px 10px #ddd;
}

.product .emoji {
    font-size: 55px;
    margin-bottom: 15px;
}

.product h3 {
    margin-bottom: 10px;
}

.price {
    color: #008b5a;
    font-size: 20px;
    font-weight: bold;
    margin: 12px;
}

button {
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    background: #008b5a;
    color: white;
    font-size: 14px;
}

button:hover {
    opacity: 0.85;
}

.cart {
    background: white;
    padding: 22px;
    margin-top: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #ddd;
}

.cart h2 {
    margin-bottom: 20px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quantity button {
    padding: 6px 11px;
}

.remove {
    background: #e53935;
}

.total {
    text-align: right;
    font-size: 23px;
    font-weight: bold;
    margin-top: 20px;
    color: #008b5a;
}

.empty {
    color: gray;
    text-align: center;
    padding: 15px;
}

@media(max-width: 500px) {
    body {
        padding: 12px;
    }

    .cart-item {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <h1>🛒 Shopping Cart</h1>
    <p>Online Shopping Made Easy</p>
</header>

<div class="container">

    <h2 style="margin-bottom:20px;">Our Products</h2>

    <div class="products">

        <div class="product">
            <div class="emoji">🎧</div>
            <h3>Headphones</h3>
            <p>Wireless Headphones</p>
            <div class="price">₹999</div>
            <button onclick="addToCart(1)">Add to Cart</button>
        </div>

        <div class="product">
            <div class="emoji">⌚</div>
            <h3>Smart Watch</h3>
            <p>Digital Smart Watch</p>
            <div class="price">₹1499</div>
            <button onclick="addToCart(2)">Add to Cart</button>
        </div>

        <div class="product">
            <div class="emoji">📱</div>
            <h3>Smart Phone</h3>
            <p>Latest Smartphone</p>
            <div class="price">₹12999</div>
            <button onclick="addToCart(3)">Add to Cart</button>
        </div>

        <div class="product">
            <div class="emoji">💻</div>
            <h3>Laptop</h3>
            <p>Personal Laptop</p>
            <div class="price">₹39999</div>
            <button onclick="addToCart(4)">Add to Cart</button>
        </div>

    </div>

    <div class="cart">
        <h2>🛒 Your Cart (<span id="count">0</span>)</h2>

        <div id="cartItems">
            <p class="empty">Your cart is empty!</p>
        </div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>
    </div>

</div>

<script>

const products = [
    {id: 1, name: "Headphones", price: 999},
    {id: 2, name: "Smart Watch", price: 1499},
    {id: 3, name: "Smart Phone", price: 12999},
    {id: 4, name: "Laptop", price: 39999}
];

let cart = [];

function addToCart(id) {

    let item = cart.find(p => p.id === id);

    if(item) {
        item.quantity++;
    } else {
        let product = products.find(p => p.id === id);

        cart.push({
            ...product,
            quantity: 1
        });
    }

    updateCart();
}

function changeQuantity(id, change) {

    let item = cart.find(p => p.id === id);

    if(item) {
        item.quantity += change;

        if(item.quantity <= 0) {
            removeItem(id);
            return;
        }
    }

    updateCart();
}

function removeItem(id) {

    cart = cart.filter(p => p.id !== id);

    updateCart();
}

function updateCart() {

    let cartItems = document.getElementById("cartItems");
    let total = 0;
    let count = 0;

    cartItems.innerHTML = "";

    if(cart.length === 0) {
        cartItems.innerHTML =
        '<p class="empty">Your cart is empty!</p>';
    }

    cart.forEach(item => {

        let itemTotal = item.price * item.quantity;

        total += itemTotal;
        count += item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">

                <div>
                    <h3>${item.name}</h3>
                    <p>₹${item.price} each</p>
                </div>

                <div class="quantity">
                    <button onclick="changeQuantity(${item.id}, -1)">-</button>

                    <span>${item.quantity}</span>

                    <button onclick="changeQuantity(${item.id}, 1)">+</button>
                </div>

                <strong>₹${itemTotal}</strong>

                <button class="remove"
                onclick="removeItem(${item.id})">
                Remove
                </button>

            </div>
        `;
    });

    document.getElementById("total").innerText =
    total.toLocaleString("en-IN");

    document.getElementById("count").innerText = count;
}

</script>

</body>
</html>
